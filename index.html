<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Honeyverse — 10 Years of Stories</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">

  <style>
    /* ---------- Fonts ---------- */
    /* Upright styles */
    @font-face {
      font-family: "sfproregular";
      src: url("./sf-pro-display/SFPRODISPLAYREGULAR.OTF") format("opentype");
      font-weight: 400;
      font-style: normal;

    @font-face {

      src: url("./sf-pro-display/SFPRODISPLAYMEDIUM.OTF") format("opentype");
      font-weight: 500;
      font-style: normal;
    }
    
    /* Note: this file name is different (hyphens + lowercase .otf) */
    @font-face {
      font-family: "sfprosemibold";
      src: url("./sf-pro-display/SF-Pro-Display-Semibold.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
    }
    
    @font-face {
      font-family: "sfprobold";
      src: url("./sf-pro-display/SFPRODISPLAYBOLD.OTF") format("opentype");
      font-weight: 700;
      font-style: normal;
    }
    
    /* Italic styles */
    @font-face {
      font-family: "sfprothinitalic";
      src: url("./sf-pro-display/SFPRODISPLAYTHINITALIC.OTF") format("opentype");
      font-weight: 100;
      font-style: italic;
    }
    
    @font-face {
      font-family: "sfproultralightitalic";
      src: url("./sf-pro-display/SFPRODISPLAYULTRALIGHTITALIC.OTF") format("opentype");

    }
    
    @font-face {

      font-weight: 300;
      font-style: italic;
    }
    
    @font-face {
      font-family: "sfprosemibolditalic";
      src: url("./sf-pro-display/SFPRODISPLAYSEMIBOLDITALIC.OTF") format("opentype");

      font-style: italic;
    }
    
    @font-face {
      font-family: "sfproheavyitalic";
      src: url("./sf-pro-display/SFPRODISPLAYHEAVYITALIC.OTF") format("opentype");
      font-weight: 800;
      font-style: italic;
    }
    
    @font-face {
      font-family: "sfproblackitalic";
      src: url("./sf-pro-display/SFPRODISPLAYBLACKITALIC.OTF") format("opentype");

      font-style: italic;
    }

    /* ---------- Bell MT ---------- */
@font-face {
  font-family: "bellmt";
  src: url("./bell-mt/bellmt.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}

@font-face {
  font-family: "bellmtitalic";
  src: url("./bell-mt/bellmtitalic.ttf") format("truetype");
  font-weight: 400;
  font-style: italic;
}

@font-face {
  font-family: "bellmtbold";
  src: url("./bell-mt/bellmtbold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}

@font-face {
  font-family: "bellmtfett";
  src: url("./bell-mt/bell-mt-fett.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}
    /* ---------- Base ---------- */
    :root {
      --pink: #e0156b;

      /* Page padding: top, left and right share one value */
      --page-pad: clamp(18px, 2.6vw, 32px);

      /* Bottom padding is separate and smaller. Change this value as needed */
      --page-pad-bottom: clamp(10px, 1.4vw, 28px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      letter-spacing: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      color: var(--pink);
      font-family: "sfpromedium", system-ui, sans-serif;
    }

    /* Scrolls up/down only when the screen is shorter than .page min-height */
    html {
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      background: #f7c9c4;
    }

    /* ---------- Background video ---------- */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      z-index: 0;
    }

    /* ---------- Layout ---------- */
    .page {
      position: relative;
      width: 100%;
      height: 100vh;   /* fallback for older browsers */
      height: 100svh;  /* correct full height on mobile browsers */
      min-height: 610px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--page-pad) var(--page-pad) var(--page-pad-bottom); /* top, sides, bottom */
    }

    /* ---------- Top bar ---------- */
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: clamp(10px, 2vw, 14px);
      border-bottom: 1px solid var(--pink);
      font-family: "sfprobold", system-ui, sans-serif;
      font-size: clamp(8px, 1.05vw, 14px);
    }
    .bar span{
      letter-spacing:0.1rem;
      color:#D9186A;
    }
    .bar a {
      color: inherit;
      text-decoration: none;
      letter-spacing:0.1rem;
      color:#D9186A;
    }

    /* ---------- Center content ---------- */
    .center {
      flex: 1;                       /* takes all space between top bar and footer */
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;   /* top aligned (not centered) */
      align-items: center;
      text-align: center;
      padding-top: clamp(32px, 7vw, 100px);
      gap: clamp(8px, 1.3vw, 18px);
    }

    .pill {
      border: 1px solid var(--pink);
      border-radius: 99px;
      padding: 0.3rem 0.45rem;
      font-family: "sfprosemibold";
      font-size: clamp(12px, 1.7vw, 18px);
      letter-spacing: 0.14rem;
      line-height:100%;
      color:#D9186A;
    }

    .formerly {
      font-size: clamp(7px, 0.85vw, 9px);
      letter-spacing: 0.1rem;
      line-height:100%;
      color:#C40053;
    }

    .logo {
     width: 400px;
    }

    .logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .tagline {
      font-family: "bellmtbold";
      font-size: clamp(15px, 1.75vw, 20px);
      letter-spacing: 0.01rem;
      line-height:100%;
      color:#D9186A;
    }

    .enter {
      font-size: clamp(8px, 0.72vw, 10px);
      line-height: 1.5;
      letter-spacing: 0.16em;
      color:#C40053;
      opacity:0.6;
      margin-top:-9px;
    }

    .enter b {
      font-size: 1.35em;
      font-weight: 600;
    }

    .enter .dot {
      /* display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 0.7em;
      border-radius: 50%;
      background: var(--pink); */
    }

    /* ---------- Footer ---------- */
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: clamp(10px, 2vw, 14px);
      border-top: 1px solid var(--pink);
    }
    .foot span{
      align-self:flex-start;
      font-size: clamp(8px, 1.15vw, 14px);
      letter-spacing: 0.12rem;
      color:#D9186A;
    }
    .social {
      display: flex;
      gap: clamp(12px, 2vw, 18px);
    }

    .social a {
      display: block;
      width: clamp(18px, 1.9vw, 20px);
      color: var(--pink);
    }

    .social svg {
      display: block;
      width: 100%;
      height: auto;
    }

    a:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 4px;
      border-radius: 4px;
    }

    @media (max-width:1164px){
      .logo {
        width: 360px;
      }
    }
    @media (max-width:1024px){
      .center{
        padding-top:70px;
      }
    }
    @media (max-width:950px){
      .enter{
        margin-top:0;
      }
    }
    /* ---------- Mobile (center section only) ---------- */
    @media (max-width: 767px) {
      .pill {
        font-size: 14px;
      }
      .center{
        padding-top:0px;
        justify-content:center;
      }
      .formerly {
        font-size: 9px;
      }

      .logo {
        width: 300px;
      }

      .enter {
        font-size: 10px;
      }
    }
  </style>
</head>
